services:
  app:
    build:
      context: .
      target: build
    command: npm run dev
    environment:
      NODE_ENV: development
      BACKEND_PORT: 5151
      FRONTEND_PORT: 5173
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: mysql://nursync:${DB_PASSWORD:-dev-password}@db:3306/nursync
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret}
      DIRECTORY_WATCH_PATH: /app/storage
      VITE_API_URL: http://localhost:5151
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_storage:/app/storage
    ports:
      - "5151:5151"
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run dev"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: nursync
      MARIADB_USER: nursync
      MARIADB_PASSWORD: ${DB_PASSWORD:-dev-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev-root-password}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mariadb_data:
  app_storage:
  node_modules:
